<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прохождения кейсов · Банковская поддержка</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="container">
      <p class="product">Банковская поддержка</p>
      <h1>Прохождения кейсов</h1>
    </div>
  </header>
  <main class="container">
    <section class="card" aria-labelledby="setup-title">
      <h2 id="setup-title">Запуск</h2>
      <form id="run-form">
        <div class="field">
          <label for="case">Кейс</label>
          <select id="case" name="case">
            <option value="duplicate-charge">Двойное списание (демо)</option>
          </select>
        </div>
        <button id="run" type="submit" disabled>Запустить</button>
      </form>
      <p id="status" role="status">Готово к запуску.</p>
    </section>

    <section class="card" id="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title">Run result</h2>
      <dl class="run-info">
        <div><dt>Run ID</dt><dd id="run-id"></dd></div>
        <div><dt>Case ID</dt><dd id="case-id"></dd></div>
        <div><dt>Duration</dt><dd id="duration"></dd></div>
      </dl>
      <h3>Customer message</h3>
      <p id="question"></p>
      <h3>Agent response</h3>
      <p id="answer"></p>
      <div class="result-grid">
        <section><h3>Evidence</h3><ul id="evidence"></ul></section>
        <section><h3>Actions</h3><ul id="actions"></ul></section>
        <section><h3>Metrics</h3><dl id="metrics"></dl></section>
      </div>
      <details>
        <summary>Run JSON</summary>
        <pre id="raw-result"></pre>
      </details>
    </section>
  </main>
</body>
</html>
