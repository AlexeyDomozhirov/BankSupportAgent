<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прохождения кейсов · Банковская поддержка</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="styles.css?v=2">
  <script type="module" src="app.js"></script>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button"
    aria-label="Включить тёмную тему" title="Включить тёмную тему">
    <svg id="theme-moon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#000" d="M20.9 13.4A9 9 0 0 1 10.6 3.1a9 9 0 1 0 10.3 10.3Z"/>
    </svg>
    <svg id="theme-sun" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display: none">
      <circle cx="12" cy="12" r="4" fill="#fff"/>
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"
        fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <header class="page-header">
    <div class="container">
      <p class="product">Банковская поддержка</p>
      <h1>Прохождения кейсов</h1>
    </div>
  </header>
  <script>
    (() => {
      const button = document.getElementById("theme-toggle");
      const moon = document.getElementById("theme-moon");
      const sun = document.getElementById("theme-sun");
      const root = document.documentElement;
      const storageKey = "dashboard-theme";

      function applyTheme(dark) {
        root.dataset.theme = dark ? "dark" : "light";
        moon.style.display = dark ? "none" : "";
        sun.style.display = dark ? "" : "none";
        const label = dark ? "Включить светлую тему" : "Включить тёмную тему";
        button.setAttribute("aria-label", label);
        button.title = label;
      }

      try {
        applyTheme(localStorage.getItem(storageKey) === "dark");
      } catch {
        applyTheme(false);
      }

      button.addEventListener("click", () => {
        const dark = root.dataset.theme !== "dark";
        applyTheme(dark);
        try {
          localStorage.setItem(storageKey, root.dataset.theme);
        } catch {
          // Выбор сохраняется только при доступном хранилище.
        }
      });
    })();
  </script>
  <main class="container">
    <section class="card" aria-labelledby="setup-title">
      <h2 id="setup-title">Запуск</h2>
      <form id="run-form">
        <div class="field">
          <label for="case">Кейс</label>
          <select id="case" name="case" disabled></select>
        </div>
        <button id="run" type="submit" disabled>Запустить</button>
      </form>
      <button id="reload-cases" type="button" hidden>Обновить список кейсов</button>
      <p id="status" role="status">Загружаем список кейсов…</p>
    </section>

    <section class="card" id="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title">Run result</h2>
      <dl class="run-info">
        <div><dt>Run ID</dt><dd id="run-id"></dd></div>
        <div><dt>Case ID</dt><dd id="case-id"></dd></div>
        <div><dt>Duration</dt><dd id="duration"></dd></div>
      </dl>
      <h3>Customer message</h3>
      <p id="question"></p>
      <h3>Agent response</h3>
      <p id="answer"></p>
      <div class="result-grid">
        <section><h3>Evidence</h3><ul id="evidence"></ul></section>
        <section><h3>Actions</h3><ul id="actions"></ul></section>
        <section><h3>Metrics</h3><dl id="metrics"></dl></section>
      </div>
      <details>
        <summary>Run JSON</summary>
        <pre id="raw-result"></pre>
      </details>
    </section>
  </main>
</body>
</html>
