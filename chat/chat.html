<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат с поддержкой · Банковская поддержка</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="chat.css">
  <script type="module" src="chat.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="container">
      <p class="product">Банковская поддержка</p>
      <h1>Чат с поддержкой</h1>
    </div>
  </header>

  <main class="container">
    <div class="chat-wrap">
      <section class="card chat" aria-labelledby="chat-title">
        <div class="chat-head">
          <span class="chat-avatar" aria-hidden="true">Б</span>
          <div class="chat-peer">
            <h2 id="chat-title">Ассистент банка</h2>
            <p class="chat-status" id="chat-status">на связи</p>
          </div>
          <label class="case-picker">
            <span>Обращение</span>
            <select id="case-select" disabled>
              <option value="">Загружаем список…</option>
            </select>
          </label>
        </div>

        <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="История переписки">
          <div class="msg msg--bot">
            <div class="msg__bubble">
              <p>Здравствуйте! Выберите обращение в списке сверху - я разберусь по операциям и отвечу на ваши вопросы.</p>
            </div>
          </div>
        </div>

        <div class="chat-footer">
          <form class="chat-form" id="chat-form">
            <label class="sr-only" for="chat-input">Сообщение</label>
            <textarea id="chat-input" name="message" rows="1" placeholder="Напишите сообщение…" required></textarea>
            <button id="chat-send" type="submit" disabled>Отправить</button>
          </form>
          <div class="chat-note-row">
            <p class="chat-note" id="chat-note" role="status">Загружаем список обращений…</p>
            <button class="ghost" id="chat-reset" type="button">Новый диалог</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
